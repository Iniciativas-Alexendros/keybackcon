name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - name: GUI py_compile
        run: python3 -m py_compile gui/*.py
      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck scripts/install.sh scripts/smoke.sh packaging/keybackcon-gui \
              packaging/debian/postinst packaging/debian/prerm packaging/aur/PKGBUILD
          else
            bash -n scripts/install.sh
            bash -n scripts/smoke.sh
            bash -n packaging/keybackcon-gui
            bash -n packaging/debian/postinst
            bash -n packaging/debian/prerm
            bash -n packaging/aur/PKGBUILD
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -- --test-threads=1

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - run: cargo test -- --test-threads=1

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: keybackcon-linux
          path: target/release/keybackcon
          if-no-files-found: error

  smoke:
    name: smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keybackcon-linux
          path: target/release
      - run: chmod +x target/release/keybackcon
      - run: bash scripts/smoke.sh
      - name: desktop-file-validate
        run: |
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate packaging/desktop/keybackcon.desktop
          else
            echo "desktop-file-validate no disponible; se omite"
          fi
