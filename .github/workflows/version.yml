name: Versionado
# Autoversionado: en cada push a main, git-cliff calcula el bump desde los
# commits convencionales (feat/fix/...) desde el último tag; si hay bump,
# sincroniza las fuentes de versión (Cargo.toml, gui/__init__.py, PKGBUILD),
# abre un PR de release en auto-merge y crea el tag vX.Y.Z. Al tag le sigue
# un workflow_dispatch de Release y NPM (un push con GITHUB_TOKEN no los
# dispararía). El CHANGELOG.md se mantiene curado a mano por release: no lo
# regenera este workflow. Los commits chore no bumpan (skip en cliff.toml).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versión actual (Cargo.toml)
        id: current
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Instala git-cliff
        run: |
          set -euo pipefail
          gh release download --repo orhun/git-cliff \
            --pattern 'git-cliff-*-x86_64-unknown-linux-gnu.tar.gz' \
            --output /tmp/git-cliff.tar.gz --clobber
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m 0755 /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
        env:
          GH_TOKEN: ${{ github.token }}

      # No usamos orhun/git-cliff-action: su output interno falla al parsear
      # el resultado (jq) y deja el bump vacío sin error visible. Aquí leemos
      # la versión directamente de la salida del binario.
      - name: Bump calculado por git-cliff
        id: cliff
        run: |
          set -uo pipefail
          BUMPED="$(git-cliff --config cliff.toml --bumped-version 2>/dev/null | tr -d '[:space:]' || true)"
          echo "version=${BUMPED#v}" >> "$GITHUB_OUTPUT"
          echo "bump calculado: '${BUMPED#v}'"

      # main es rama protegida (requiere checks) y los eventos de GITHUB_TOKEN
      # no disparan workflows: por eso se empuja una rama y se fusiona con un
      # PR en auto-merge, y el tag se acompaña de un workflow_dispatch manual
      # de Release y NPM (los dispatch sí encadenan workflows con este token).
      - name: Sincronizar versiones, PR de release y tag
        if: steps.cliff.outputs.version != '' && steps.cliff.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW="${{ steps.cliff.outputs.version }}"
          OLD="${{ steps.current.outputs.version }}"
          echo "bump: $OLD -> $NEW"
          sed -i "s/^version = \"$OLD\"/version = \"$NEW\"/" Cargo.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$NEW\"/" gui/__init__.py
          sed -i "s/^pkgver=.*/pkgver=$NEW/" packaging/aur/PKGBUILD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml gui/__init__.py packaging/aur/PKGBUILD
          if git diff --cached --quiet; then
            echo "sin cambios: el release ya está en camino"
            exit 0
          fi
          # Sin [skip ci]: la rama del release necesita checks para que el
          # auto-merge del PR pueda completarse (la protección los exige).
          git commit -m "chore(release): prepara v$NEW"
          BRANCH="chore/release-v$NEW"
          git tag "v$NEW"
          git push origin "HEAD:$BRANCH" --tags
          # gh pr merge sin argumentos resuelve la rama del checkout (main),
          # no el PR recién creado: hay que pasarle el número explícito.
          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v$NEW" \
            --body "Sincroniza Cargo.toml, gui/__init__.py y packaging/aur/PKGBUILD a v$NEW. El tag v$NEW dispara Release y NPM.")"
          PR_NUM="${PR_URL##*/}"
          gh pr merge "$PR_NUM" --auto --squash --delete-branch
          gh workflow run Release --ref "v$NEW"
          gh workflow run NPM --ref "v$NEW"
